<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Client · Golden Atlas Errachidia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <style>
        :root {
            --gold: #c5a059;
            --gold-light: #e8d5a3;
            --gold-dark: #a8873e;
            --dark: #050505;
            --glass: rgba(12, 11, 10, 0.85);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--dark);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        #world { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .auth-wrapper { position: relative; z-index: 10; width: 100%; max-width: 520px; }
        
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 45px 40px;
            box-shadow: 0 45px 90px rgba(0,0,0,0.85);
            border-radius: 4px;
            animation: fadeIn 1.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .back-link {
            display: inline-flex; align-items: center; gap: 10px;
            color: rgba(197, 160, 89, 0.7); text-decoration: none;
            font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
            margin-bottom: 30px; transition: var(--transition); padding: 8px 14px; background: rgba(197, 160, 89, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.15);
        }
        .back-link:hover { color: var(--gold); transform: translateX(-5px); background: rgba(197, 160, 89, 0.1); }
        
        .logo-block { text-align: center; margin-bottom: 35px; }
        .logo-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: 4px; }
        .logo-subtitle { font-size: 0.6rem; letter-spacing: 6px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-top: 8px; }

        .auth-tabs { display: flex; border-bottom: 1px solid rgba(197, 160, 89, 0.15); margin-bottom: 30px; }
        .tab-btn {
            flex: 1; padding: 14px; background: none; border: none; color: rgba(255,255,255,0.4);
            font-family: inherit; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: var(--transition); border-bottom: 2px solid transparent; font-weight: 600;
        }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
        .tab-btn:hover { color: #fff; }

        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeSlide 0.5s ease; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.6rem; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(197, 160, 89, 0.15); color: #fff; outline: none;
            font-family: inherit; font-size: 0.9rem; transition: var(--transition);
        }
        .form-group input:focus { border-color: var(--gold); background: rgba(255,255,255,0.06); box-shadow: 0 0 15px rgba(197,160,89,0.2); }
        
        .btn-submit {
            width: 100%; height: 50px; background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            border: none; color: #000; font-size: 0.75rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
            cursor: pointer; transition: var(--transition); margin-top: 10px; border-radius: 2px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(197,160,89,0.3); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .google-auth-btn {
            width: 100%; height: 50px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer;
            transition: var(--transition); margin-bottom: 25px; border-radius: 2px;
        }
        .google-auth-btn:hover { background: rgba(255,255,255,0.05); border-color: #fff; }
        .google-icon { width: 18px; height: 18px; }

        .forgot-link { display: block; text-align: center; font-size: 0.65rem; color: rgba(255,255,255,0.4); text-decoration: none; margin-top: 15px; letter-spacing: 1px; transition: var(--transition); }
        .forgot-link:hover { color: var(--gold-light); }

        .divider { display: flex; align-items: center; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.65rem; letter-spacing: 2px; margin: 25px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        /* Loader */
        .spinner {
            display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;
        }
        .btn-submit.loading .spinner { display: block; }
        .btn-submit.loading span { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast notifications */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(40px);
            padding: 15px 30px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px;
            opacity: 0; transition: var(--transition); z-index: 9999; text-align: center; min-width: 300px;
        }
        .toast.success { background: var(--gold); color: #000; opacity: 1; transform: translateX(-50%) translateY(0); box-shadow: 0 10px 30px rgba(197,160,89,0.3); }
        .toast.error { background: #ef4444; color: #fff; opacity: 1; transform: translateX(-50%) translateY(0); box-shadow: 0 10px 30px rgba(239,68,68,0.3); }

        @media (max-width: 600px) {
            body { padding: 25px 12px; }
            .auth-card { padding: 35px 20px; }
            .logo-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div id="world"></div>
    <div class="toast" id="notify-toast"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <a href="index.html" class="back-link">← Retour · Accueil</a>
            <div class="logo-block">
                <span class="logo-title">GOLDEN ATLAS</span>
                <p class="logo-subtitle">PORTAIL PRIVÉ HÔTES</p>
            </div>

            <!-- Google Login Button -->
            <button class="google-auth-btn" id="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5.04c1.64 0 3.12.56 4.28 1.67l3.2-3.2C17.52 1.58 14.96 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.86 3C6.28 7.57 8.91 5.04 12 5.04z"/><path fill="#4285F4" d="M23.14 12.27c0-.76-.08-1.53-.2-2.27H12v4.51h6.25c-.27 1.42-1.08 2.63-2.29 3.44l3.56 2.76c2.08-1.92 3.28-4.74 3.28-8.44z"/><path fill="#FBBC05" d="M5.36 14.5c-.24-.72-.38-1.49-.38-2.5s.14-1.78.38-2.5L1.5 6.5C.54 8.44 0 10.61 0 13s.54 4.56 1.5 6.5l3.86-3z"/><path fill="#34A853" d="M12 23c3.24 0 5.97-1.08 7.96-2.92l-3.56-2.76c-1.1.74-2.52 1.18-4.4 1.18-3.09 0-5.72-2.53-6.64-5.46L1.5 16.5C3.4 20.35 7.35 23 12 23z"/></svg>
                Continuer avec Google
            </button>

            <div class="divider">OU</div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchPanel('login')">Se connecter</button>
                <button class="tab-btn" onclick="switchPanel('register')">S'enregistrer</button>
            </div>

            <!-- PANEL 1: LOGIN -->
            <div class="form-panel active" id="panel-login">
                <form id="form-login-email">
                    <div class="form-group">
                        <label>Adresse E-mail</label>
                        <input type="email" id="login-email" required placeholder="nom@exemple.com">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="login-password" required placeholder="Votre mot de passe">
                    </div>
                    <button type="submit" class="btn-submit" id="btn-login-submit">
                        <span>Se Connecter</span>
                        <div class="spinner"></div>
                    </button>
                </form>
                <a href="#" class="forgot-link" onclick="switchPanel('reset')">Mot de passe oublié ?</a>
            </div>

            <!-- PANEL 2: REGISTER -->
            <div class="form-panel" id="panel-register">
                <form id="form-register-email">
                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" id="reg-name" required placeholder="Prénom et nom">
                    </div>
                    <div class="form-group">
                        <label>Adresse E-mail</label>
                        <input type="email" id="reg-email" required placeholder="nom@exemple.com">
                    </div>
                    <div class="form-group">
                        <label>Téléphone (Optionnel)</label>
                        <input type="tel" id="reg-phone" placeholder="Ex: +212 600-000000">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="reg-password" required placeholder="Min 6 caractères">
                    </div>
                    <button type="submit" class="btn-submit" id="btn-register-submit">
                        <span>Créer un Compte</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <!-- PANEL 3: RESET PASSWORD -->
            <div class="form-panel" id="panel-reset">
                <form id="form-reset-password">
                    <div class="form-group">
                        <label>Adresse E-mail du compte</label>
                        <input type="email" id="reset-email" required placeholder="nom@exemple.com">
                    </div>
                    <button type="submit" class="btn-submit" id="btn-reset-submit">
                        <span>Envoyer le lien de réinitialisation</span>
                        <div class="spinner"></div>
                    </button>
                </form>
                <a href="#" class="forgot-link" onclick="switchPanel('login')">Retour à la connexion</a>
            </div>

        </div>
    </div>

    <script>
        // ── 3D Particles Background ──
        (function() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 50, 200);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('world').appendChild(renderer.domElement);
            
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            // Ring cylinders (Golden Plexus Theme)
            const cylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(400, 400, 600, 30, 20, true),
                new THREE.MeshBasicMaterial({ color: 0xc5a059, wireframe: true, transparent: true, opacity: 0.05 })
            );
            cylinder.rotation.x = -Math.PI / 4;
            scene.add(cylinder);

            function animate() {
                requestAnimationFrame(animate);
                cylinder.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        })();

        // ── Toast System ──
        function showNotification(message, status = 'success') {
            const toast = document.getElementById('notify-toast');
            toast.textContent = message;
            toast.className = 'toast ' + status;
            setTimeout(() => {
                toast.className = 'toast';
            }, 5000);
        }

        // ── Tabs Switch ──
        window.switchPanel = function(panel) {
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (panel === 'login') {
                document.getElementById('panel-login').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else if (panel === 'register') {
                document.getElementById('panel-register').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            } else if (panel === 'reset') {
                document.getElementById('panel-reset').classList.add('active');
            }
        };

        // ── Supabase Auth Logic ──
        window.addEventListener('load', async () => {
            const client = window.supabaseClient;
            if (!client) {
                showNotification("Erreur de configuration Supabase.", "error");
                return;
            }

            // check active session
            const { data: { session } } = await client.auth.getSession();
            if (session?.user) {
                // Pre-fill local storage cache for compatibility
                await fetchAndCacheProfile(session.user);
                window.location.href = 'dashboard-client.html';
            }

            // listen to auth state changes
            client.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session?.user) {
                    await fetchAndCacheProfile(session.user);
                    // Redirect to dashboard
                    window.location.href = 'dashboard-client.html';
                }
            });
        });

        // Helper to fetch/create profile details to cache locally
        async function fetchAndCacheProfile(user) {
            const client = window.supabaseClient;
            // Fetch profile
            let { data: profile } = await client.from('profiles').select('*').eq('id', user.id).single();
            
            // If profile does not exist yet (OAuth might take a second, or trigger is slow), wait a moment or create fallback
            if (!profile) {
                const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0];
                profile = {
                    id: user.id,
                    name: name,
                    email: user.email,
                    phone: user.phone || user.user_metadata?.phone || '',
                    avatar_url: user.user_metadata?.avatar_url || ''
                };
            } else {
                // Map columns to match local cache variable format
                profile = {
                    id: profile.id,
                    name: profile.full_name,
                    email: profile.email,
                    phone: profile.phone || '',
                    avatar_url: profile.avatar_url || ''
                };
            }
            localStorage.setItem('ga_current_user', JSON.stringify(profile));
        }

        // Action: Sign In
        document.getElementById('form-login-email').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login-submit');

            btn.classList.add('loading');
            btn.disabled = true;

            const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showNotification(error.message, "error");
                btn.classList.remove('loading');
                btn.disabled = false;
            } else {
                showNotification("Connexion réussie. Redirection...");
                // Handled by onAuthStateChange or redirect immediately
                await fetchAndCacheProfile(data.user);
                window.location.href = 'dashboard-client.html';
            }
        });

        // Action: Register / Sign Up
        document.getElementById('form-register-email').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-register-submit');

            btn.classList.add('loading');
            btn.disabled = true;

            const { data, error } = await window.supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: fullName,
                        phone: phone
                    }
                }
            });

            btn.classList.remove('loading');
            btn.disabled = false;

            if (error) {
                showNotification(error.message, "error");
            } else {
                // If sign-up confirmation is required
                if (data.session === null) {
                    showNotification("Inscription réussie ! Veuillez vérifier vos e-mails pour confirmer votre inscription.", "success");
                } else {
                    showNotification("Compte créé avec succès. Connexion...");
                    await fetchAndCacheProfile(data.user);
                    window.location.href = 'dashboard-client.html';
                }
            }
        });

        // Action: Google Auth
        document.getElementById('btn-google').addEventListener('click', async () => {
            const redirectUrl = window.location.origin + window.location.pathname.replace('login-client.html', 'dashboard-client.html');
            const { error } = await window.supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: redirectUrl
                }
            });
            if (error) {
                showNotification(error.message, "error");
            }
        });

        // Action: Password Reset
        document.getElementById('form-reset-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const btn = document.getElementById('btn-reset-submit');

            btn.classList.add('loading');
            btn.disabled = true;

            const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname.replace('login-client.html', 'dashboard-client.html') + '?type=recovery'
            });

            btn.classList.remove('loading');
            btn.disabled = false;

            if (error) {
                showNotification(error.message, "error");
            } else {
                showNotification("Un lien de réinitialisation vous a été envoyé par e-mail.", "success");
                document.getElementById('form-reset-password').reset();
            }
        });
    </script>
</body>
</html>
